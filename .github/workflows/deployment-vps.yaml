name: Deployment Flow

on:
  # pull_request
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Image to Docker Hub
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup Buildx (Docker builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate production version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="v0.1.0"
          else
            TAG_NO_V="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_NO_V"
            VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Generated production version: ${VERSION}"

      - name: Create and push git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists on remote."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${VERSION}"
            git push origin "${VERSION}"
            echo "Pushed tag ${VERSION}"
          fi

      # Build & Push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dev-system-repository:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dev-system-repository:${{ steps.version.outputs.version }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    name: SSH & Deploy to VPS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Deploy project over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eux

            # Pull image with generated tag
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/dev-system-repository:${{ needs.build-and-push.outputs.image_tag }}

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            # Stop old container (ignore errors)
            docker stop dev-system-app || true
            docker rm dev-system-app || true

            # Run new container
            docker run -d \
               --name dev-system-app \
               -p 80:3000 \
               --restart unless-stopped \
               "$IMAGE"
