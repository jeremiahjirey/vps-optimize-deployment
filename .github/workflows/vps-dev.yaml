name: Deployment Flow

on:
  # pull_request
  push:
    branches: ["dev"]
    # paths:
    #   - ".github/workflows/vps-prod.yaml"
    #   - "docker/Dockerfile"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Image to Docker Hub
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup Buildx (Docker builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dev-system-repository:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    name: SSH & Deploy to VPS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Copy docker-compose.yaml to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose-dev.yaml"
          target: "/home/jeremi/app/"

      - name: Deploy project over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eux 

            # IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/dev-system-repository:latest

            # echo "Stopping old container (if exists)…"
            # docker stop dev-app || true
            # docker rm dev-app || true

            # echo "Deleting the old version image"
            # docker rmi "$IMAGE"

            # echo "Pulling image: $IMAGE"
            # docker pull "$IMAGE"

            # echo "Running new container…"
            # docker run -d --name dev-app -p 8080:3000 "$IMAGE"

            cd /home/jeremi/app

            echo "Stop running containers"
            docker-compose down || true

            # echo "Stop running containers for this project"
            # docker ps --filter "label=project=dev-system" -q | xargs -r docker stop
            # docker ps -aq --filter "label=project=dev-system" | xargs -r docker rm

            echo "Remove unused images for this repo only"
            docker images ${{ secrets.DOCKERHUB_USERNAME }}/dev-system-repository -q | xargs -r docker rmi -f || true

            echo "Pull latest image"
            docker-compose pull

            echo "Recreate container"
            docker-compose up -d --force-recreate

            # cleanup global safe 
            #docker image prune -f --filter "until=24h"
